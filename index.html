<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f172a">
<title>Mortgage Rates</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh}
.header{background:#0f172a;border-bottom:1px solid #1e293b;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
.logo{font-size:13px;font-weight:600;color:#94a3b8;letter-spacing:.05em;text-transform:uppercase}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:11px;padding:3px 8px;border-radius:4px;font-weight:500}
.badge-prime{background:#1e3a5f;color:#7dd3fc}
.badge-bench{background:#1c3a2e;color:#6ee7b7}
.badge-date{background:#1e1b2e;color:#a78bfa}
.ticker-wrap{overflow:hidden;background:#080f1e;border-bottom:1px solid #1e293b;padding:8px 0}
.ticker-track{display:flex;white-space:nowrap;animation:scroll 50s linear infinite}
.ticker-track:hover{animation-play-state:paused}
.ticker-item{display:inline-flex;align-items:center;gap:8px;padding:0 24px;border-right:1px solid #1e293b;font-size:12px}
.ticker-lender{color:#64748b;font-weight:500}
.ticker-rate{color:#7dd3fc;font-weight:700;font-size:13px}
.ticker-label{color:#475569;font-size:11px}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.filter-panel{background:#080f1e;border-bottom:1px solid #1e293b;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.filter-group{display:flex;flex-direction:column;gap:5px}
.filter-label{font-size:10px;color:#475569;text-transform:uppercase;letter-spacing:.07em}
.filter-row{display:flex;gap:5px;flex-wrap:wrap}
.pill{font-size:11px;padding:4px 11px;border-radius:20px;border:1px solid #1e293b;background:transparent;color:#64748b;cursor:pointer;transition:all .15s;white-space:nowrap}
.pill.active{background:#1e3a5f;border-color:#2563eb;color:#7dd3fc}
.pill.active.var{background:#1c3a2e;border-color:#059669;color:#6ee7b7}
.pill:hover:not(.active){border-color:#334155;color:#94a3b8}
.sort-select{font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid #1e293b;background:#0f172a;color:#94a3b8;cursor:pointer;outline:none}
.filter-divider{width:1px;background:#1e293b;align-self:stretch;margin:0 4px}
.result-info{margin-left:auto;font-size:11px;color:#334155;align-self:center}
.status-bar{padding:7px 16px;background:#080f1e;border-bottom:1px solid #1e293b;font-size:11px;display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:#334155;flex-shrink:0}
.dot.ok{background:#6ee7b7}
.dot.err{background:#f87171}
.dot.loading{background:#fbbf24;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.status-text{color:#475569}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1px;background:#1e293b}
.lender-card{background:#0f172a;padding:16px}
.lender-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.lender-name{font-size:14px;font-weight:600;color:#e2e8f0}
.lender-sub{font-size:11px;color:#475569;margin-top:2px}
.rate-group{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rate-cell{background:#080f1e;border-radius:6px;padding:8px 10px}
.rate-cell-label{font-size:10px;color:#475569;margin-bottom:3px;line-height:1.3}
.rate-val{font-size:13px;font-weight:700;color:#7dd3fc}
.rate-val.var{color:#6ee7b7}
.rate-val.refi{color:#c4b5fd}
.rate-val.empty{color:#1e293b;font-size:11px}
.rate-cell.best{border:1px solid #451a03}
.rate-cell.best .rate-val{color:#fbbf24}
.section-divider{grid-column:1/-1;font-size:10px;color:#334155;text-transform:uppercase;letter-spacing:.08em;padding:6px 0 2px;border-top:1px solid #1e293b;margin-top:2px}
.footer{padding:10px 16px;border-top:1px solid #1e293b;font-size:11px;color:#334155;display:flex;justify-content:space-between;align-items:center}
.refresh-btn{font-size:11px;padding:4px 12px;border-radius:4px;border:1px solid #1e293b;background:transparent;color:#64748b;cursor:pointer}
.refresh-btn:hover{border-color:#2563eb;color:#7dd3fc}
.no-data{padding:60px;text-align:center;color:#334155;font-size:13px;grid-column:1/-1}
</style>
</head>

      <button class="pill" onclick="setFilter('group','lenderiq-mic',this)">LIQ MIC</button>

    </div>
  </div>
  <div class="filter-divider"></div>
  <div class="filter-group">
    <div class="filter-label">Sort by</div>
    <div class="filter-row">
      <select class="sort-select" id="sort-select" onchange="renderAll()">
        <option value="rate-asc">Lowest rate first</option>
        <option value="rate-desc">Highest rate first</option>
        <option value="lender-asc">Lender A→Z</option>
        <option value="lender-desc">Lender Z→A</option>
      </select>
    </div>
  </div>
  <div class="filter-divider"></div>
  <div class="filter-group">
    <div class="filter-label">Ticker lenders</div>
    <div class="filter-row">
      <button class="pill active" onclick="setTickerMode('all',this)">All</button>
      <button class="pill" onclick="setTickerMode('pick',this)">Pick lenders</button>
    </div>
    <div id="lender-picker" style="display:none;margin-top:6px;max-width:520px">
      <div id="lender-checkboxes" style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px"></div>
      <button class="pill active" style="border-color:#2563eb" onclick="refreshTicker()">&#8635; Refresh ticker</button>
    </div>
  </div>
  <span class="result-info" id="result-info"></span>
</div>

<div class="grid" id="grid"><div class="no-data">Loading...</div></div>

<div class="footer">
  <span>Rates subject to change without notice &bull; O.A.C. &bull; For internal use only</span>
  <button class="refresh-btn" onclick="loadData()">&#8635; Refresh</button>

<script>
// ── Config ────────────────────────────────────────────────────────────────────

  {key:"5yr Var - Insured",        col:"5yr Var - Insured",     term:"5yr",type:"variable",ins:"insured",  label:"5yr Var — Insured",     cls:"var",  div:"5-Year Variable"},

  {key:"4yr Fixed - Insured",      col:"4yr Fixed - Insured",   term:"4yr",type:"fixed",   ins:"insured",  label:"4yr Fixed — Insured",   cls:"",     div:"4-Year Fixed"},
  {key:"4yr Fixed - Uninsured",    col:"4yr Fixed - Uninsured", term:"4yr",type:"fixed",   ins:"uninsured",label:"4yr Fixed — Uninsured", cls:""},

];

  "MCAP":"lenderiq-national",

  // Regional
  "Desjardins":"lenderiq-regional",
  "DUCA":"lenderiq-regional",
  "FirstOntario Credit Union":"lenderiq-regional",
  "Meridian":"lenderiq-regional",
  "Alterna":"lenderiq-regional",
  "Ganaraska Financial Credit Union":"lenderiq-regional",
  "IC Savings":"lenderiq-regional",
  "Effort Trust":"lenderiq-regional",
  "CTBC Bank":"lenderiq-regional",
  "Shinhan Bank of Canada":"lenderiq-regional",

  // Alternative
  "Equitable Alternative Solutions":"lenderiq-alt",
  "Community Trust":"lenderiq-alt",

  "HAVENTREE Bank":"lenderiq-alt",

  "CWB Optimum Mortgage (Alternative Lending)":"lenderiq-alt",

};
var allData     = [];
var filters     = {group:"all",type:"all",term:"all",ins:"all"};

var tickerLenders = {};

// ── CSV parser ────────────────────────────────────────────────────────────────
function parseLine(line) {
  var result = [], cur = "", inQ = false;
  for (var i = 0; i < line.length; i++) {
    var c = line[i];
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { result.push(cur.trim()); cur = ""; }
    else { cur += c; }
  }
  result.push(cur.trim());
  return result;
}

function colIdx(headers, name) {
  for (var i = 0; i < headers.length; i++) {
    if (headers[i] === name) return i;
  }
  return -1;
}

function isRate(v) {
  if (!v) return false;
  // Reject penalty descriptions and other non-rate text
  if (/penalty|bona fide|clause|sale/i.test(v)) return false;
  if (!isNaN(parseFloat(v))) return true;
  if (/^\d[\d.]*\s*\(P/.test(v)) return true;
  return false;
}

function parseMainCSV(text) {
  var lines = text.trim().split("\n").map(parseLine);
  var hIdx  = 0;
  for (var i = 0; i < lines.length; i++) {
    if (lines[i].indexOf("Lender") >= 0) { hIdx = i; break; }
  }
  var h   = lines[hIdx];
  var meta = lines.slice(0, hIdx).join(" ");
  var pm  = meta.match(/Prime Rate[:\s]+([\d.]+)/);
  var bm  = meta.match(/Benchmark[:\s]+([\d.]+)/);
  var dm  = meta.match(/Sheet date[:\s]+([\d/]+)/);
  if (pm) document.getElementById("prime-badge").textContent = "Prime: " + pm[1] + "%";
  if (bm) document.getElementById("bench-badge").textContent = "Bench: " + bm[1] + "%";
  if (dm) document.getElementById("date-badge").textContent  = "Sheet: " + dm[1];

  var rows = [];
  for (var i = hIdx + 1; i < lines.length; i++) {
    var r = lines[i];
    var lender = r[colIdx(h, "Lender")] || "";
    if (!lender || lender === "Lender") continue;
    if (/low feature|regional lenders/i.test(lender)) continue;
    var obj = {
      lender: lender,
      date:   r[colIdx(h, "Date Updated")] || "",
      group:  GROUPS[lender] || "national",
      prime:  parseFloat((pm || [])[1]) || 4.45
    };
    for (var j = 0; j < RATE_CELLS.length; j++) {
      var rc  = RATE_CELLS[j];
      var idx = colIdx(h, rc.key);
      var val = (idx >= 0 && r[idx]) ? r[idx] : "";
      obj[rc.key] = isRate(val) ? val : "";
    }
    rows.push(obj);
  }
  return rows;
}

function parsePromoCSV(text) {
  var lines = text.trim().split("\n").map(parseLine);
  var hIdx  = 0;
  for (var i = 0; i < lines.length; i++) {
    if (lines[i].indexOf("Lender") >= 0) { hIdx = i; break; }
  }
  var h    = lines[hIdx];
  var rows = [];
  for (var i = hIdx + 1; i < lines.length; i++) {
    var r = lines[i];
    var lender = r[colIdx(h, "Lender")] || "";
    if (!lender || lender === "Lender") continue;
    var obj = {
      lender: lender,
      date:   r[colIdx(h, "Date Updated")] || "",
      group:  "promo",
      prime:  4.45
    };
    for (var j = 0; j < RATE_CELLS.length; j++) {
      var rc  = RATE_CELLS[j];
      var cname = rc.pkey || rc.key;
      var idx   = colIdx(h, cname);
      var val   = (idx >= 0 && r[idx]) ? r[idx] : "";
      obj[rc.key] = isRate(val) ? val : "";
    }
    rows.push(obj);
  }
  return rows;
}

var TICKER_SKIP = ["First Nat (Rate Option +)","CMLS (Rate Advantage)","MCAP (Value-Flex)","RMG (Low Rate Basic)"];

function parseLenderIQCSV(text) {
  var lines = text.trim().split("\n").map(parseLine);
  var hIdx  = 0;
  for (var i = 0; i < lines.length; i++) {
    if (lines[i].indexOf("Lender") >= 0) { hIdx = i; break; }
  }
  var h   = lines[hIdx];
  var col = function(name) {
    for (var i = 0; i < h.length; i++) { if (h[i] === name) return i; }
    return -1;
  };
  var rows = [];
  for (var i = hIdx + 1; i < lines.length; i++) {
    var r      = lines[i];
    var lender = r[col("Lender")] || "";
    if (!lender || lender === "Lender") continue;
    if (/low feature|regional lenders/i.test(lender)) continue;
    var grp = LIQ_GROUPS[lender] || "lenderiq-national";
    var obj = {
      lender: lender,
      date:   r[col("Parsed At")] || "",
      group:  grp,
      prime:  4.45
    };
    // Map standard RATE_CELLS keys to LenderIQ sheet column names
    var liqMap = {
      "5yr Fixed - Insured":      "5yr Fixed - Insured",
      "5yr Fixed - Unins (25yr)": "5yr Fixed - Uninsured",
      "5yr Fixed - Refi (25yr)":  "5yr Fixed - Refi",
      "5yr Fixed - Rentals":      "5yr Fixed - Rental",
      "5yr Var - Insured":        "5yr Var - Insured",
      "5yr Var - Unins (25yr)":   "5yr Var - Uninsured",
      "5yr Var - Refi (25yr)":    "5yr Var - Refi",
      "3yr Fixed - Insured":      "3yr Fixed - Insured",
      "3yr Fixed - Ins 80%":      "3yr Fixed - Insured",
      "3yr Fixed - Unins+Refi":   "3yr Fixed - Uninsured",
      "4yr Fixed - Insured":      "4yr Fixed - Insured",
      "4yr Fixed - Uninsured":    "4yr Fixed - Uninsured",
    };
    for (var key in liqMap) {
      var srcCol = liqMap[key];
      var idx    = col(srcCol);
      var val    = (idx >= 0 && r[idx]) ? r[idx] : "";
      obj[key]   = isRate(val) ? val : "";
    }
    // Also initialise unused RATE_CELLS keys to empty
    for (var j = 0; j < RATE_CELLS.length; j++) {
      if (obj[RATE_CELLS[j].key] === undefined) obj[RATE_CELLS[j].key] = "";
    }
    rows.push(obj);
  }
  console.log("LenderIQ rows parsed:", rows.length, rows[0] ? rows[0].lender : "none");
  return rows;
}

function parseNBCCSV(text) {
  var lines = text.trim().split("\n").map(parseLine);
  var hIdx  = 0;
  for (var i = 0; i < lines.length; i++) {
    if (lines[i].indexOf("Lender") >= 0) { hIdx = i; break; }
  }
  var h    = lines[hIdx];
  var rows = [];
  for (var i = hIdx + 1; i < lines.length; i++) {
    var r = lines[i];
    var lender = r[colIdx(h, "Lender")] || "";
    if (!lender || lender === "Lender") continue;
    var obj = {
      lender: lender,
      date:   r[colIdx(h, "Date Updated")] || "",
      group:  "promo",
      prime:  4.45
    };
    // Use NBC_CELLS to map columns
    for (var j = 0; j < NBC_CELLS.length; j++) {
      var nc  = NBC_CELLS[j];
      var idx = colIdx(h, nc.col);
      var val = (idx >= 0 && r[idx]) ? r[idx] : "";
      obj[nc.key] = isRate(val) ? val : "";
    }
    // Also initialise unused keys to empty
    for (var j = 0; j < RATE_CELLS.length; j++) {
      if (obj[RATE_CELLS[j].key] === undefined) obj[RATE_CELLS[j].key] = "";
    }
    rows.push(obj);
  }
  return rows;
}

function parseB2BCSV(text) {
  var lines = text.trim().split("\n").map(parseLine);
  // Row 0 = metadata: Last updated, Effective, Prime%, Bulletin, ...
  var meta = lines[0] || [];
  var effDate = "";
  var prime = 4.45;
  for (var i = 0; i < meta.length; i++) {
    var m;
    if ((m = meta[i].match(/Effective:\s*(.+)/))) effDate = m[1].trim();
    if ((m = meta[i].match(/Prime:\s*([\d.]+)/))) prime = parseFloat(m[1]);
  }

  // Walk rows to build rate lookup: b2b[term_or_product][type] = {pmpp, standard}
  var fixed = {};    // e.g. fixed["5 Year Closed"]["Insured"] = {pmpp:"3.99%", standard:"4.14%"}
  var variable = {}; // e.g. variable["5 Year Variable - Insured"] = {pmpp:"...", standard:"..."}
  var section = "";

  for (var i = 1; i < lines.length; i++) {
    var r = lines[i];
    var r0 = (r[0] || "").trim();
    var r0l = r0.toLowerCase();

    // Detect section headers
    if (r0l.indexOf("fixed rate") >= 0 && r0l.indexOf("variable") < 0) { section = "fixed"; continue; }
    if (r0l === "variable rate & heloc") { section = "variable"; continue; }
    if (r0l.indexOf("new construction") >= 0) { section = "nc"; continue; }
    // Skip sub-headers
    if (r0 === "Term" || r0 === "Product" || !r0) continue;

    if (section === "fixed" && r.length >= 4) {
      var term = r0;
      var type = (r[1] || "").trim();
      if (!type) continue;
      if (!fixed[term]) fixed[term] = {};
      fixed[term][type] = { pmpp: (r[2]||"").trim(), standard: (r[3]||"").trim() };
    }
    else if (section === "variable" && r.length >= 4) {
      var product = r0;
      variable[product] = { pmpp: (r[2]||"").trim(), standard: (r[3]||"").trim() };
    }
  }

  // Map to standard RATE_CELLS keys for PMPP and Standard tiers
  var mapping = [
    { key: "5yr Fixed - Insured",      fixed: "5 Year Closed", type: "Insured" },
    { key: "5yr Fixed - Unins (25yr)", fixed: "5 Year Closed", type: "Conventional" },
    { key: "3yr Fixed - Insured",      fixed: "3 Year Closed", type: "Insured" },
    { key: "3yr Fixed - Unins+Refi",   fixed: "3 Year Closed", type: "Conventional" },
    { key: "5yr Var - Insured",        var: "5 Year VRM (Insured)" },
    { key: "5yr Var - Unins (25yr)",   var: "5 Year VRM (Conventional)" },
  ];

  function buildLender(name, tier) {
    var obj = {
      lender: name,
      date: effDate,
      group: GROUPS[name] || "national",
      prime: prime
    };
    for (var j = 0; j < RATE_CELLS.length; j++) obj[RATE_CELLS[j].key] = "";
    for (var j = 0; j < mapping.length; j++) {
      var m = mapping[j];
      var val = "";
      if (m.fixed && fixed[m.fixed] && fixed[m.fixed][m.type]) {
        val = fixed[m.fixed][m.type][tier] || "";
      } else if (m["var"] && variable[m["var"]]) {
        val = variable[m["var"]][tier] || "";
      }
      if (isRate(val)) obj[m.key] = val;
    }
    return obj;
  }

  var rows = [];
  rows.push(buildLender("B2B Bank (PMPP)", "pmpp"));
  rows.push(buildLender("B2B Bank (Standard)", "standard"));
  console.log("B2B rows parsed:", rows.length, "5yr Fix Ins PMPP:", rows[0]["5yr Fixed - Insured"], "Std:", rows[1]["5yr Fixed - Insured"]);
  return rows;
}

// ── Fetch ─────────────────────────────────────────────────────────────────────
function loadData() {
  setStatus("loading", "Loading live rates...");
  Promise.all([fetch(CSV_MAIN), fetch(CSV_PROMO), fetch(CSV_NBC), fetch(CSV_LENDERIQ), fetch(CSV_B2B)])
    .then(function(responses) {
      return Promise.all(responses.map(function(r) { return r.text(); }));
    })
    .then(function(texts) {
      var main     = parseMainCSV(texts[0]);
      var promo    = parsePromoCSV(texts[1]);
      var nbc      = parseNBCCSV(texts[2]);
      var lenderiq = parseLenderIQCSV(texts[3]);
      var b2b      = parseB2BCSV(texts[4]);
      allData      = main.concat(promo).concat(nbc).concat(lenderiq).concat(b2b);
      buildLenderPicker();
      setStatus("ok", "Live — " + allData.length + " lenders — " + new Date().toLocaleTimeString());
      renderAll();
    })
    .catch(function(e) {
      setStatus("err", "Error: " + e.message);
    });
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function numVal(str) {
  var m = str && str.match(/^[\d.]+/);
  return m ? parseFloat(m[0]) : null;
}

function cellsForLender(lender) {
  // NBC lenders use NBC_CELLS for display, others use RATE_CELLS
  if (lender === "National Bank (Purchase Without Cashback or External Refinancing)" ||
      lender === "National Bank (Purchase With Cashback)") {
    return NBC_CELLS;
  }
  return RATE_CELLS;
}

function cellVisible(rc) {
  if (filters.type !== "all" && rc.type !== filters.type) return false;
  if (filters.term !== "all" && rc.term !== filters.term) return false;
  if (filters.ins  !== "all" && rc.ins  !== filters.ins)  return false;
  return true;
}

function lenderSortRate(l) {
  var cells = cellsForLender(l.lender);
  var best  = null;
  for (var i = 0; i < cells.length; i++) {
    if (!cellVisible(cells[i])) continue;
    var v = numVal(l[cells[i].key]);
    if (v !== null && (best === null || v < best)) best = v;
  }
  return best === null ? 999 : best;
}

function setStatus(state, msg) {
  document.getElementById("dot").className          = "dot " + state;
  document.getElementById("status-text").textContent = msg;
}

// ── Filters ───────────────────────────────────────────────────────────────────
function setFilter(dim, val, btn) {
  filters[dim] = val;
  btn.closest(".filter-row").querySelectorAll(".pill").forEach(function(p) {
    p.classList.remove("active","var");
  });
  btn.classList.add("active");
  if (val === "variable") btn.classList.add("var");
  renderAll();
}

// ── Ticker lender picker ──────────────────────────────────────────────────────
function buildLenderPicker() {
  var box = document.getElementById("lender-checkboxes");
  box.innerHTML = "";
  allData.forEach(function(l) {
    var btn = document.createElement("button");
    btn.className   = "pill" + (tickerLenders[l.lender] ? " active" : "");
    btn.textContent = l.lender;
    btn.onclick     = function() {
      tickerLenders[l.lender] = !tickerLenders[l.lender];
      btn.classList.toggle("active", !!tickerLenders[l.lender]);
      renderTickerOnly();
    };
    box.appendChild(btn);
  });
}

function setTickerMode(mode, btn) {
  tickerMode = mode;
  btn.closest(".filter-row").querySelectorAll(".pill").forEach(function(p) { p.classList.remove("active"); });
  btn.classList.add("active");
  document.getElementById("lender-picker").style.display = mode === "pick" ? "block" : "none";
  document.getElementById("lender-checkboxes").style.display = "flex";
  renderTickerOnly();
}

function refreshTicker() {
  document.getElementById("lender-checkboxes").style.display = "none";
  renderTickerOnly();
}

// ── Render ────────────────────────────────────────────────────────────────────
function getFilteredLenders() {
  var lenders = filters.group === "all" ? allData : allData.filter(function(l) { return l.group === filters.group; });
  var s = document.getElementById("sort-select").value;
  lenders = lenders.slice();
  if (s === "rate-asc")   lenders.sort(function(a,b) { return lenderSortRate(a) - lenderSortRate(b); });
  if (s === "rate-desc")  lenders.sort(function(a,b) { return lenderSortRate(b) - lenderSortRate(a); });
  if (s === "lender-asc") lenders.sort(function(a,b) { return a.lender.localeCompare(b.lender); });
  if (s === "lender-desc")lenders.sort(function(a,b) { return b.lender.localeCompare(a.lender); });
  return lenders;
}

function findBest(lenders) {
  var best = null;
  lenders.forEach(function(l) {
    var cells = cellsForLender(l.lender);
    cells.forEach(function(rc) {
      if (!cellVisible(rc)) return;
      var v = numVal(l[rc.key]);
      if (v !== null && (best === null || v < best)) best = v;
    });
  });
  return best;
}

function renderTickerOnly() {
  var lenders = getFilteredLenders();
  var src     = lenders;
  if (tickerMode === "pick") {
    src = allData.filter(function(l) { return tickerLenders[l.lender]; });
  } else {
    src = src.filter(function(l) { return TICKER_SKIP.indexOf(l.lender) < 0; });
  }
  var items = [];
  src.forEach(function(l) {
    var cells = cellsForLender(l.lender);
    cells.forEach(function(rc) {
      if (!cellVisible(rc)) return;
      var val = l[rc.key];
      if (!val) return;
      items.push({lender:l.lender, val:val, label:rc.label, num:numVal(val)||999});
    });
  });
  items.sort(function(a,b) { return a.num - b.num; });
  items = items.slice(0, 24);
  var html = items.map(function(it) {
    return '<span class="ticker-item"><span class="ticker-lender">' + it.lender +
           '</span><span class="ticker-rate">' + it.val +
           '</span><span class="ticker-label">' + it.label + '</span></span>';
  }).join("");
  document.getElementById("ticker").innerHTML = html + html;
}

function renderGrid(lenders) {
  var bestNum = findBest(lenders);
  var html    = "";
  var visible = 0;

  lenders.forEach(function(l) {
    var cells  = cellsForLender(l.lender);
    var hasAny = cells.some(function(rc) { return cellVisible(rc) && l[rc.key]; });
    if (!hasAny) return;
    visible++;

    var sortRate  = lenderSortRate(l);
    var isBestCard = (sortRate === bestNum && bestNum !== 999);
    var cellsHtml = "";

    cells.forEach(function(rc) {
      if (rc.div && cellVisible(rc)) {
        cellsHtml += '<div class="section-divider">' + rc.div + '</div>';
      }
      if (!cellVisible(rc)) return;
      var val   = l[rc.key] || "";
      var empty = !val;
      var isBest = !empty && numVal(val) === bestNum;
      cellsHtml += '<div class="rate-cell' + (isBest ? " best" : "") + '">' +
        '<div class="rate-cell-label">' + rc.label + '</div>' +
        '<div class="rate-val ' + rc.cls + (empty ? " empty" : "") + '">' + (empty ? "—" : val) + '</div>' +
        '</div>';
    });

    html += '<div class="lender-card">' +
      '<div class="lender-header"><div>' +
        '<div class="lender-name">' + l.lender + '</div>' +
        '<div class="lender-sub">Updated ' + l.date + ' &bull; Prime ' + l.prime + '%' + (l.note ? ' &bull; ' + l.note : '') + '</div>' +
      '</div>' +
      (isBestCard ? '<span style="font-size:10px;padding:2px 8px;border-radius:3px;background:#451a03;color:#fbbf24">&#9733; Best</span>' : '') +
      '</div><div class="rate-group">' + cellsHtml + '</div></div>';
  });

  document.getElementById("grid").innerHTML = html || '<div class="no-data">No rates match your filters.</div>';
  document.getElementById("result-info").textContent = visible + " lenders shown";
}

function renderAll() {
  var lenders = getFilteredLenders();
  renderTickerOnly();
  renderGrid(lenders);
}

// ── Boot ──────────────────────────────────────────────────────────────────────
loadData();
setInterval(loadData, 10 * 60 * 1000);
</script>
